name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/bootstrap
      - run: just check
      - if: always()
        name: Summarize coverage
        run: |
          if [[ -s target/reports/coverage.txt ]]; then
            {
              printf '### Coverage\n\n```\n'
              cat target/reports/coverage.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports
          path: |
            target/nextest/ci/junit.xml
            target/reports/

  dependency-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: bash scripts/bootstrap
      - run: just deny

  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and smoke-test the production image
        run: |
          docker build --tag ado-code-review:ci .
          test "$(docker run --rm ado-code-review:ci divide 7 2)" = "3.5"
