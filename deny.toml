[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
private = { ignore = true }
include-dev = false

[[licenses.exceptions]]
# CA certificate bundle required by the pinned Copilot SDK's build dependency.
crate = "webpki-root-certs@1.0.12"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
