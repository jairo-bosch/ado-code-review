repos:
  - repo: builtin
    hooks:
      - id: check-toml
      - id: check-yaml
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: Clippy
        entry: cargo clippy --workspace --all-targets --locked
        language: system
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)clippy\.toml$)'
        pass_filenames: false
      - id: actionlint
        name: GitHub Actions lint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
      - id: zizmor
        name: GitHub Actions security lint
        entry: zizmor --offline .github/workflows
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
