title = "ado-code-review gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "azure-devops-pat"
description = "Azure DevOps personal access token (legacy and current formats)"
regex = '''(?i)[\w.-]{0,50}?(?:ado|azure|devops|pat)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z2-7]{52}|[a-z0-9]{76}(?-i:AZDO)[a-z0-9]{4})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["ado", "azure", "devops", "pat"]

[[rules]]
id = "azure-devops-pat-signature"
description = "Azure DevOps personal access token (84-character signature)"
regex = '''\b([A-Za-z0-9]{76}AZDO[A-Za-z0-9]{4})\b'''
entropy = 3
keywords = ["azdo"]
