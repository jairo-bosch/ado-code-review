title = "ado-code-review gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "azure-devops-pat"
description = "Azure DevOps personal access token (legacy 52-character format)"
regex = '''(?i)[\w.-]{0,50}?(?:ado|azure|devops|pat)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z2-7]{52})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["ado", "azure", "devops", "pat"]
