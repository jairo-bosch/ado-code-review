too-many-lines-threshold = 40
too-many-arguments-threshold = 3
excessive-nesting-threshold = 5
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-unwrap-in-consts = false
allow-expect-in-consts = false
allowed-duplicate-crates = ["syn"]  # The pinned Copilot SDK still uses Syn 2 in transitive macros.
