[package]
name = "ado-code-review"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
description = "Command-line code review for Azure DevOps pull requests"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
copilot-sdk = { version = "=2.0.2", default-features = false, features = ["runtime"] }
flate2 = "1"
globset = "0.4"
http = "1"
httpdate = "1"
percent-encoding = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", default-features = false }
predicates = "3"
rstest = "0.29"
wiremock = "0.6"

[target.'cfg(not(target_env = "musl"))'.dependencies]
curl = "0.4"

[target.'cfg(target_env = "musl")'.dependencies]
curl = { version = "0.4", features = ["static-curl", "static-ssl"] }

[lints]
workspace = true

[workspace]
members = ["xtask"]

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
excessive_nesting = "deny"
expect_used = "deny"
indexing_slicing = "deny"
nursery = { level = "deny", priority = -1 }
panic = "deny"
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_arguments = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"

[workspace.metadata.quality.size]
file-lines = 300
impl-lines = 200
fields = 5
public-methods = 10

[workspace.metadata.quality.function]
cyclomatic = 8
cognitive = 10
branches = 8
boolean-operands = 3

[workspace.metadata.quality.counts]
statements = 30
locals = 10
exits = 4

[workspace.metadata.quality.tools]
coverage = 90
duplicate-lines = 6
duplicate-threshold = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
