[package]
name = "ado-code-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Command-line calculator for the Azure DevOps review CLI migration"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
rstest = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
